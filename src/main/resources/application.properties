spring.application.name=musicstream

# Cấu hình lưu trữ
app.upload.dir=./storage/audio

# Giới hạn kích thước file upload (cho phép FLAC, WAV chất lượng cao lên tới 200MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1

# Cấu hình H2 Database lưu file vĩnh viễn trên ổ cứng (thư mục ./data/musicdb)
spring.datasource.url=jdbc:h2:file:./data/musicdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

# Cấu hình JWT (Secret key 256-bit Hex/Base64 và thời hạn 24 giờ)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000