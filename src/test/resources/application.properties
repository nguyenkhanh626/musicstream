spring.application.name=musicstream-test

# Thư mục lưu trữ riêng biệt cho Test (nằm trong target, không đụng vào thư mục lưu trữ thật)
app.upload.dir=./target/test-storage

# H2 In-Memory Database dành riêng cho Test (tuyệt đối KHÔNG ghi đè hay xóa CSDL thật ./data/musicdb)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Cấu hình JWT cho Test
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

